<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bevy Scratchbook</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04050a; color: #cfd6e4; font: 14px system-ui, sans-serif; }
    #frame { position: fixed; inset: 0; }
    #sim { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="frame"><canvas id="sim"></canvas></div>
  <div id="loading">Loading simulation…</div>
  <script type="module">
    import init from "./dist/sims.js";
    init().catch((e) => {
      // Bevy's web main loop exits through an exception by design.
      if (!String(e).includes("Using exceptions for control flow")) throw e;
    });
    document.getElementById("loading").remove();
  </script>
</body>
</html>
