[workspace]
resolver = "2"
members = ["app", "crates/fluid-2d", "web"]
default-members = ["app"]

[workspace.dependencies]
# `2d` minus its ui bits, so the wasm build leaves bevy_ui out. Native adds
# `ui`, `bevy_feathers` and `ui_picking` back per target.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "scene",
    "bevy_picking",
    "sprite_picking",
] }
rand = "0.10"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
panic = "abort"
opt-level = 3
codegen-units = 1
incremental = false
debug = false
